<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un match sur Clutchtime</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 24px; line-height: 1.6; font-size: 18px; color: #0e1424; background: #f6f7fb; text-align: center; }
  a.button { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 14px; background: #ffc53d; color: #1a1300; font-weight: 600; text-decoration: none; }
  a { color: #6a4900; }
  @media (prefers-color-scheme: dark) { body { color: #f2f4f8; background: #0b0f1a; } a { color: #ffc53d; } }
  .muted { opacity: .8; font-size: .95em; }
</style>
</head>
<body>
<h1>Clutchtime</h1>
<p>Quelqu'un t'a partagé un match d'e-sport.</p>
<a class="button" id="open" href="#">Ouvrir dans Clutchtime</a>
<p class="muted">Clutchtime arrive bientôt sur l'App Store.</p>
<p class="muted" lang="en">Someone shared an esports match with you. Tap the button to open it in Clutchtime.</p>
<script>
  // Seul un numéro de match est accepté : la page n'ouvre rien d'autre que l'app.
  const id = new URLSearchParams(location.search).get("id");
  const button = document.getElementById("open");
  if (id && /^\d{1,12}$/.test(id)) {
    const target = "clutchtime://match/" + id;
    button.href = target;
    location.href = target;
  } else {
    button.style.display = "none";
  }
</script>
</body>
</html>
