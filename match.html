<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un match sur Esportly</title>
<meta name="description" content="Un match d'e-sport partagé depuis Esportly : le score, le direct et les alertes de tes équipes.">
<!-- Aperçu du lien dans les messageries et les réseaux sociaux. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Esportly">
<meta property="og:title" content="Un match d'e-sport à suivre sur Esportly">
<meta property="og:description" content="Le score, le direct et les alertes de tes équipes d'e-sport, sans compte.">
<meta property="og:image" content="https://esportly.protojo.fr/apercu.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta property="og:image:alt" content="Logo d'Esportly">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://esportly.protojo.fr/apercu.png">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 24px; line-height: 1.6; font-size: 18px; color: #0e1424; background: #f6f7fb; text-align: center; }
  a.button { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 14px; background: #ffc53d; color: #1a1300; font-weight: 600; text-decoration: none; }
  a { color: #6a4900; }
  @media (prefers-color-scheme: dark) { body { color: #f2f4f8; background: #0b0f1a; } a { color: #ffc53d; } }
  .muted { opacity: .8; font-size: .95em; }
</style>
</head>
<body>
<h1>Esportly</h1>
<p>Quelqu'un t'a partagé un match d'e-sport.</p>
<a class="button" id="open" href="#">Ouvrir dans Esportly</a>
<p class="muted" id="store">Pas encore l'app ? Elle arrive sur l'App Store pour iPhone et iPad.</p>
<p class="muted" lang="en">Someone shared an esports match with you. Tap the button to open it in Esportly.</p>
<p class="muted">Données e-sport fournies par <a href="https://pandascore.co">PandaScore</a>.</p>
<script>
  // Seul un numéro de match est accepté : la page n'ouvre rien d'autre que l'app.
  const id = new URLSearchParams(location.search).get("id");
  const button = document.getElementById("open");
  if (id && /^\d{1,12}$/.test(id)) {
    const target = "clutchtime://match/" + id;
    button.href = target;
    location.href = target;
  } else {
    button.style.display = "none";
  }
  // Le lien vers l'App Store vient de version.json, rempli une fois l'app publiée.
  fetch("version.json", { cache: "no-store" })
    .then((response) => response.json())
    .then((info) => {
      if (!info.storeURL || !/^https:\/\/apps\.apple\.com\//.test(info.storeURL)) return;
      const store = document.getElementById("store");
      store.textContent = "Pas encore l'app ? ";
      const link = document.createElement("a");
      link.href = info.storeURL;
      link.textContent = "Télécharger Esportly sur l'App Store";
      store.appendChild(link);
    })
    .catch(() => {});
</script>
</body>
</html>
